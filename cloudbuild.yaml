steps:
  # Build da imagem Docker (variáveis VITE_* precisam existir em build-time).
  # entrypoint bash é obrigatório aqui: "docker build" direto (sem shell) não expande
  # $$VITE_SUPABASE_ANON_KEY — o valor literal "$VITE_SUPABASE_ANON_KEY" acabava indo
  # pro --build-arg em vez do secret de verdade.
  - name: "gcr.io/cloud-builders/docker"
    entrypoint: bash
    args:
      - -c
      - |
        docker build -t "$_IMAGE" \
          --build-arg VITE_SUPABASE_URL=https://clsuturkoripoingjqpw.supabase.co \
          --build-arg VITE_SUPABASE_ANON_KEY="$$VITE_SUPABASE_ANON_KEY" \
          .
    secretEnv: ['VITE_SUPABASE_ANON_KEY']

  # Push para o Artifact Registry
  - name: "gcr.io/cloud-builders/docker"
    args:
      - push
      - "$_IMAGE"

  # Deploy no Cloud Run com secrets
  - name: "gcr.io/google.com/cloudsdktool/cloud-sdk"
    entrypoint: gcloud
    args:
      - run
      - deploy
      - siact-mrosc
      - --image=$_IMAGE
      - --region=$_REGION
      - --platform=managed
      - --allow-unauthenticated
      - --min-instances=0
      - --max-instances=3
      - --memory=512Mi
      - --cpu=1
      - --port=8080
      - --set-env-vars=NODE_ENV=production,SUPABASE_URL=https://clsuturkoripoingjqpw.supabase.co,VITE_SUPABASE_URL=https://clsuturkoripoingjqpw.supabase.co
      - --update-secrets=ANTHROPIC_API_KEY=ANTHROPIC_API_KEY:latest,ANTHROPIC_WORKSPACE_ID=ANTHROPIC_WORKSPACE_ID:latest,SUPABASE_SERVICE_ROLE_KEY=SUPABASE_SERVICE_ROLE_KEY:latest,VITE_SUPABASE_ANON_KEY=VITE_SUPABASE_ANON_KEY:latest

substitutions:
  _REGION: southamerica-east1
  _IMAGE: southamerica-east1-docker.pkg.dev/gen-lang-client-0565048097/siact/siact-mrosc:$SHORT_SHA

availableSecrets:
  secretManager:
    - versionName: projects/gen-lang-client-0565048097/secrets/VITE_SUPABASE_ANON_KEY/versions/latest
      env: 'VITE_SUPABASE_ANON_KEY'

options:
  logging: CLOUD_LOGGING_ONLY
